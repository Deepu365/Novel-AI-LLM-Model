
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>NovaMind AI | Intelligent Chat Assistant</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d19;
      color: #eef2ff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      height: 92vh;
      min-height: 500px;
      display: flex;
      background: #111a2c;
      border: 1px solid #2a3854;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 70px #0006;
    }

    .sidebar {
      width: 245px;
      min-width: 210px;
      display: flex;
      flex-direction: column;
      background: #0d1526;
      border-right: 1px solid #2a3854;
    }

    .side-top {
      padding: 16px;
      border-bottom: 1px solid #2a3854;
    }

    .side-title {
      font-weight: bold;
      margin-bottom: 14px;
      font-size: 17px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      background: #315de8;
      color: white;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .history-heading {
      padding: 16px 14px 8px;
      color: #aab8d2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #historyList {
      flex: 1;
      overflow-y: auto;
      padding: 5px 9px 12px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }

    .history-open {
      flex: 1;
      min-width: 0;
      padding: 11px 9px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #dce5fa;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-open:hover,
    .history-open.active {
      background: #202c43;
      border-color: #34435f;
    }

    .delete-chat {
      padding: 8px;
      background: transparent;
      color: #fca5a5;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
    }

    .delete-chat:hover {
      background: #43232f;
    }

    .empty-history {
      padding: 10px;
      color: #8796b4;
      font-size: 12px;
      line-height: 1.6;
    }

    .main-chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #2a3854;
      background: #141e32;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, #5578ff, #9b6cff);
      font-size: 23px;
      font-weight: bold;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      color: #aab8d2;
      font-size: 13px;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .tag {
      padding: 7px 10px;
      border: 1px solid #34435f;
      border-radius: 20px;
      color: #cbd7f1;
      font-size: 11px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 5px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 88%;
      padding: 13px 16px;
      border-radius: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      font-size: 14px;
    }

    .user {
      align-self: flex-end;
      background: #315de8;
      border-bottom-right-radius: 5px;
    }

    .bot {
      align-self: flex-start;
      background: #202c43;
      border: 1px solid #2d3a53;
      border-bottom-left-radius: 5px;
    }

    .welcome {
      max-width: 100%;
      line-height: 1.8;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #2a3854;
      background: #141e32;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #394866;
      border-radius: 12px;
      background: #0a1120;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus { border-color: #718cff; }

    #sendButton {
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #5277ff, #7959e9);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .footer {
      padding: 0 12px 12px;
      background: #141e32;
      text-align: center;
      color: #8796b4;
      font-size: 11px;
    }

    .save-status {
      color: #8da2c7;
      font-size: 11px;
      text-align: right;
      padding: 0 16px 8px;
      background: #141e32;
    }

    @media (max-width: 650px) {
      body { padding: 0; }
      .app {
        height: 100vh;
        min-height: 0;
        border-radius: 0;
      }
      .sidebar {
        width: 125px;
        min-width: 125px;
      }
      .side-top { padding: 10px; }
      .side-title { font-size: 14px; }
      .new-chat { padding: 10px 5px; font-size: 12px; }
      .history-heading { padding: 12px 8px 6px; font-size: 10px; }
      #historyList { padding: 4px; }
      .history-open { padding: 9px 5px; font-size: 11px; }
      .delete-chat { padding: 5px 3px; font-size: 11px; }
      header { padding: 13px; }
      header h1 { font-size: 19px; }
      .logo { width: 35px; height: 35px; font-size: 19px; }
      .details { gap: 5px; }
      .tag { padding: 5px 6px; font-size: 9px; }
      #messages { padding: 12px; }
      .message { max-width: 96%; font-size: 13px; padding: 11px; }
      form { padding: 10px; gap: 6px; }
      input { padding: 11px 8px; font-size: 12px; }
      #sendButton { padding: 0 10px; font-size: 12px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <aside class="sidebar">
      <div class="side-top">
        <div class="side-title">💬 Your Chats</div>
        <button type="button" class="new-chat" id="newChatButton">
          + New Chat
        </button>
      </div>

      <div class="history-heading">Chat History</div>
      <div id="historyList"></div>
    </aside>

    <section class="main-chat">
      <header>
        <div class="brand">
          <div class="logo">N</div>
          <div>
            <h1>NovaMind AI</h1>
            <p>Your personal AI assistant</p>
          </div>
        </div>

        <div class="details">
          <span class="tag">Model: Llama 3</span>
          <span class="tag">Powered by Ollama</span>
          <span class="tag"><span class="status-dot"></span>Local AI</span>
        </div>
      </header>

      <section id="messages" aria-live="polite"></section>

      <form id="chatForm">
        <input
          id="question"
          type="text"
          placeholder="Ask NovaMind AI anything..."
          maxlength="500"
          autocomplete="off"
          required
        >
        <button id="sendButton" type="submit">Send ↑</button>
      </form>

      <div id="saveStatus" class="save-status">Chats saved in this browser</div>

      <div class="footer">
        NovaMind AI · Local LLM Assistant · Responses may need verification
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");
    const historyList = document.getElementById("historyList");
    const newChatButton = document.getElementById("newChatButton");
    const saveStatus = document.getElementById("saveStatus");

    const STORAGE_KEY = "novamind_chat_history_v1";

    let chats = loadChats();
    let currentChatId = null;
    let busy = false;

    function loadChats() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(stored) ? stored : [];
      } catch {
        return [];
      }
    }

    function saveChats() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        saveStatus.textContent = "✓ History auto-saved";
      } catch {
        saveStatus.textContent = "Could not save history. Browser storage may be full.";
      }
    }

    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function welcomeMessage() {
      return {
        role: "bot",
        text: "Welcome to NovaMind AI! 👋\n\nAsk me questions, explore AI concepts, or get help with coding.\n\nTip: For answers based on your own documents, a RAG document-retrieval feature needs to be configured."
      };
    }

    function getCurrentChat() {
      return chats.find(chat => chat.id === currentChatId);
    }

    function createChat() {
      const chat = {
        id: makeId(),
        title: "New Chat",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        messages: [welcomeMessage()]
      };

      chats.unshift(chat);
      currentChatId = chat.id;
      saveChats();
      renderHistory();
      renderMessages();
      input.focus();
    }

    function addMessage(text, role) {
      const bubble = document.createElement("div");
      bubble.className = "message " + role;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function renderMessages() {
      messages.replaceChildren();
      const chat = getCurrentChat();

      if (!chat) {
        addMessage("Welcome to NovaMind AI! 👋\n\nStart a new chat to ask a question.", "bot");
        return;
      }

      chat.messages.forEach(message => {
        const bubble = addMessage(message.text, message.role);
        if (message.role === "bot" && message.text.startsWith("Welcome to NovaMind AI!")) {
          bubble.classList.add("welcome");
        }
      });
    }

    function renderHistory() {
      historyList.replaceChildren();

      if (chats.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.textContent = "Your conversations will appear here automatically.";
        historyList.appendChild(empty);
        return;
      }

      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = "history-item";

        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.className = "history-open" +
          (chat.id === currentChatId ? " active" : "");
        openButton.textContent = chat.title || "New Chat";
        openButton.title = chat.title || "New Chat";
        openButton.addEventListener("click", () => {
          if (busy) return;
          currentChatId = chat.id;
          renderHistory();
          renderMessages();
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-chat";
        deleteButton.textContent = "×";
        deleteButton.title = "Delete this chat";
        deleteButton.setAttribute("aria-label", "Delete " + (chat.title || "chat"));

        deleteButton.addEventListener("click", () => {
          if (busy) return;
          const confirmed = confirm("Delete this conversation?");
          if (!confirmed) return;

          chats = chats.filter(item => item.id !== chat.id);

          if (currentChatId === chat.id) {
            currentChatId = null;
          }

          saveChats();

          if (!currentChatId || !getCurrentChat()) {
            if (chats.length > 0) {
              currentChatId = chats[0].id;
            } else {
              createChat();
              return;
            }
          }

          renderHistory();
          renderMessages();
        });

        item.append(openButton, deleteButton);
        historyList.appendChild(item);
      });
    }

    function addSavedMessage(role, text) {
      const chat = getCurrentChat();
      if (!chat) return;

      chat.messages.push({ role, text });
      chat.updatedAt = Date.now();

      if (role === "user" && chat.title === "New Chat") {
        chat.title = text.length > 30 ? text.slice(0, 30) + "…" : text;
      }

      chats.sort((a, b) => b.updatedAt - a.updatedAt);
      saveChats();
      renderHistory();
    }

    newChatButton.addEventListener("click", () => {
      if (busy) return;
      createChat();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message || busy) return;

      if (!getCurrentChat()) {
        createChat();
      }

      addSavedMessage("user", message);
      addMessage(message, "user");
      input.value = "";

      busy = true;
      sendButton.disabled = true;
      newChatButton.disabled = true;

      const waiting = addMessage("NovaMind AI is thinking...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        const answer = data.answer || "No answer was returned.";
        waiting.textContent = answer;
        addSavedMessage("bot", answer);

      } catch (error) {
        const errorText = "Error: " + error.message;
        waiting.textContent = errorText;
        addSavedMessage("bot", errorText);
      } finally {
        busy = false;
        sendButton.disabled = false;
        newChatButton.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    });

    if (chats.length > 0) {
      currentChatId = chats[0].id;
      renderHistory();
      renderMessages();
    } else {
      createChat();
    }
  </script>
</body>
</html>
